[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamtunnel"
version = "0.1.0"
description = "Python SDK for dreamTunnel — instant public HTTPS tunnels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tunnel", "ngrok", "https", "webhook", "localhost", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://tunnel.swag.best"
Repository = "https://github.com/dreamcatchered/dreamTunnel"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dreamtunnel = "dreamtunnel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
